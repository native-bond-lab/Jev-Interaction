<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 409" width="760" height="409" role="img" aria-label="换配置，行为跟着变吗. 四份自带配置 × 12 段录音。分开程度：预期高的配置得分高于预期低的配置的比例。"><title>换配置，行为跟着变吗</title><style>
