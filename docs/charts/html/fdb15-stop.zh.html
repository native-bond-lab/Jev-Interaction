<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=820"><style>
:root{--bg:#ffffff;--ink:#1f2328;--ink2:#59636e;--muted:#818b98;--line:#d1d9e0;
--ours:#2a78d6;--before:#86b6ef;--ref:#b4bcc5}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--ink:#e6edf3;--ink2:#9198a1;--muted:#768390;--line:#30363d;
--ours:#5598e7;--before:#1f5aa6;--ref:#4a525c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);padding:18px 20px 22px;
font:14px/1.3 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Noto Sans CJK SC",sans-serif}
.legend{display:flex;gap:20px;font-size:13px;color:var(--ink2);margin:0 0 16px}
.sw{width:11px;height:11px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:-1px}
.grid{display:grid;column-gap:30px}
.grid+.grid{margin-top:26px}
.h{font-size:13.5px;font-weight:600;padding:0 0 10px 10px;white-space:nowrap}
.h small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.lab{display:flex;align-items:center;justify-content:flex-end;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.lab.b{color:var(--ink);font-weight:600}
.cell{position:relative;border-left:1px solid var(--line);display:flex;flex-direction:column;justify-content:center;gap:3px}
.row{display:flex;align-items:center}
.bar{border-radius:0 4px 4px 0;min-width:2px}
.val{position:relative;background:var(--bg);padding:0 3px;font-size:12.5px;margin-left:4px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.val.o{color:var(--ink);font-weight:600}
.dash{position:absolute;top:0;bottom:0;border-left:1.5px dashed var(--muted);opacity:.7}
body{width:820px}</style></head><body><div class="grid" style="grid-template-columns:max-content repeat(2,1fr)"><div></div><div class="h">用户插话<small>越短越好</small></div><div class="h">用户应声<small>越长越好</small></div><div class="lab" style="height:30px">GPT-4o</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.0920)"></i><span class="val">0.23 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.0467)"></i><span class="val">0.21 s</span></div></div><div class="lab" style="height:30px">Freeze-Omni</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.5680)"></i><span class="val">1.42 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.1467)"></i><span class="val">0.66 s</span></div></div><div class="lab" style="height:30px">Moshi</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.4640)"></i><span class="val">1.16 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.0933)"></i><span class="val">0.42 s</span></div></div><div class="lab" style="height:30px">Gemini</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.8800)"></i><span class="val">2.20 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.1467)"></i><span class="val">0.66 s</span></div></div><div class="lab" style="height:30px">Nova Sonic</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.9000)"></i><span class="val">2.25 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ref);width:calc((100% - 64px) * 0.1422)"></i><span class="val">0.64 s</span></div></div><div class="lab b" style="height:30px">Jev · 原样</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--before);width:calc((100% - 64px) * 0.2160)"></i><span class="val">0.54 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--before);width:calc((100% - 64px) * 0.0800)"></i><span class="val">0.36 s</span></div></div><div class="lab b" style="height:30px">Jev · 两处调整</div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ours);width:calc((100% - 64px) * 0.4600)"></i><span class="val o">1.15 s</span></div></div><div class="cell" style="height:30px"><div class="row"><i class="bar" style="height:12px;background:var(--ours);width:calc((100% - 64px) * 0.8978)"></i><span class="val o">4.04 s</span></div></div></div></body></html>
