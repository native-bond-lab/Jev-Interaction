<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1320" width="960" height="1320" role="img" aria-label="Jev-Interaction, top to bottom. Hear: the caller's audio arrives as 200 millisecond frames; voice activity detection and a streaming recognizer turn them into words, pauses and who is talking. Decide: the call state, the decision questions and the task profile go to Jev, which returns a probability for every choice; a policy turns them into an action, and every decision is recorded for replay. Speak: the action drives any language model and any speech synthesizer and controls playback directly. Frames keep arriving while the agent talks, so it listens while it speaks.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#121a2c"/>
    </linearGradient>
    <linearGradient id="jevfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3a"/>
      <stop offset="1" stop-color="#0b2b33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #e5e7eb; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -0.01em; }
    .tag { font-size: 14px; fill: #94a3b8; }
    .stage { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; }
    .n { font-size: 15px; font-weight: 650; }
    .d { font-size: 12px; fill: #94a3b8; }
    .small { font-size: 11px; fill: #94a3b8; }
    .lab { font-size: 12px; font-weight: 600; }
    .panel { fill: #ffffff; fill-opacity: 0.025; stroke: #1f2a40; stroke-width: 1.2; }
    .node { fill: #172036; stroke: #2b3a55; stroke-width: 1.2; }
    .rec { fill: #1b1626; stroke: #fb7185; stroke-opacity: .55; stroke-width: 1.2; stroke-dasharray: 5 5; }
    .frame { fill: #13213a; stroke: #2f4a74; stroke-width: 1.1; }
    .frame.quiet { fill: #121a2b; stroke: #263247; }
    .lvl { fill: #60a5fa; } .lvl.dim { fill: #34425c; }
    .wire { fill: none; stroke-width: 1.8; stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
    .b { stroke: #60a5fa; } .t { stroke: #2dd4bf; } .a { stroke: #fbbf24; } .r { stroke: #fb7185; }
    .bar { fill: #2dd4bf; } .bar.dim { fill: #3b4a66; }
    .halo { animation: breathe 2.8s ease-in-out infinite; transform-origin: 480px 706px; }
    .cursor { fill: none; stroke: #e5e7eb; stroke-width: 1.6; animation: scan 4.8s steps(12) infinite; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
    @keyframes scan { from { transform: translateX(0); } to { transform: translateX(600px); } }
    @media (prefers-reduced-motion: reduce) { .wire, .halo, .cursor { animation: none; } }
  </style>

  <rect width="960" height="1320" rx="22" fill="url(#bg)"/>
  <text x="48" y="62" class="title">Jev-Interaction</text>
  <text x="48" y="90" class="tag">Full duplex from a cascade: every turn-taking behaviour is a plain-language question, answered by Jev.</text>

  <!-- 1 HEAR -->
  <rect x="36" y="116" width="888" height="356" rx="18" class="panel"/>
  <text x="60" y="148" class="stage" fill="#60a5fa">1 · HEAR</text>
  <rect x="60" y="172" width="200" height="64" rx="12" class="node"/>
  <text x="80" y="198" class="n">Caller</text>
  <text x="80" y="219" class="d">microphone · 16 kHz PCM16</text>
  <path d="M260,204 H292" class="wire b" marker-end="url(#mb)"/>
  <rect x="300" y="176" width="44" height="56" rx="6" class="frame"/><rect x="315.0" y="192" width="14" height="23" rx="3" class="lvl"/><rect x="350" y="176" width="44" height="56" rx="6" class="frame"/><rect x="365.0" y="186" width="14" height="37" rx="3" class="lvl"/><rect x="400" y="176" width="44" height="56" rx="6" class="frame"/><rect x="415.0" y="188" width="14" height="31" rx="3" class="lvl"/><rect x="450" y="176" width="44" height="56" rx="6" class="frame"/><rect x="465.0" y="192" width="14" height="25" rx="3" class="lvl"/><rect x="500" y="176" width="44" height="56" rx="6" class="frame"/><rect x="515.0" y="186" width="14" height="35" rx="3" class="lvl"/><rect x="550" y="176" width="44" height="56" rx="6" class="frame"/><rect x="565.0" y="196" width="14" height="16" rx="3" class="lvl"/><rect x="600" y="176" width="44" height="56" rx="6" class="frame quiet"/><rect x="615.0" y="202" width="14" height="3" rx="3" class="lvl dim"/><rect x="650" y="176" width="44" height="56" rx="6" class="frame quiet"/><rect x="665.0" y="202" width="14" height="3" rx="3" class="lvl dim"/><rect x="700" y="176" width="44" height="56" rx="6" class="frame"/><rect x="715.0" y="190" width="14" height="29" rx="3" class="lvl"/><rect x="750" y="176" width="44" height="56" rx="6" class="frame"/><rect x="765.0" y="184" width="14" height="39" rx="3" class="lvl"/><rect x="800" y="176" width="44" height="56" rx="6" class="frame"/><rect x="815.0" y="188" width="14" height="33" rx="3" class="lvl"/><rect x="850" y="176" width="44" height="56" rx="6" class="frame"/><rect x="865.0" y="199" width="14" height="10" rx="3" class="lvl"/>
  <rect x="298" y="174" width="48" height="60" rx="7" class="cursor"/>
  <text x="300" y="250" class="small" text-anchor="middle">0.0 s</text><text x="547" y="250" class="small" text-anchor="middle">1.0 s</text><text x="797" y="250" class="small" text-anchor="middle">2.0 s</text><text x="894" y="250" class="small" text-anchor="middle">2.4 s</text>
  <text x="300" y="164" class="small">every 200 ms, one frame</text>
  <path d="M600,170 V164 H694 V170" fill="none" stroke="#2dd4bf" stroke-width="1.4"/>
  <text x="647" y="158" class="small" fill="#2dd4bf" text-anchor="middle" style="fill:#2dd4bf">a pause → Jev is asked</text>

  <path d="M597,260 V276 H175 V300" class="wire b" marker-end="url(#mb)"/>
  <path d="M597,276 H747 V300" class="wire b" marker-end="url(#mb)"/>
  <rect x="60" y="304" width="400" height="64" rx="12" class="node"/>
  <text x="80" y="330" class="n">Voice activity</text>
  <text x="80" y="351" class="d">is this frame voice? · any VAD, energy built in</text>
  <rect x="500" y="304" width="400" height="64" rx="12" class="node"/>
  <text x="520" y="330" class="n">Streaming recognizer</text>
  <text x="520" y="351" class="d">closed segments + word timing · any ASR</text>
  <path d="M260,368 V392 H700 V368" fill="none" stroke="#2b3a55" stroke-width="1.2"/>
  <text x="480" y="420" class="d" text-anchor="middle">words · how long they have been quiet · who is talking · whether the agent is speaking</text>
  <path d="M480,430 V530" class="wire b" marker-end="url(#mb)"/>

  <!-- 2 DECIDE -->
  <rect x="36" y="492" width="888" height="468" rx="18" class="panel"/>
  <text x="60" y="524" class="stage" fill="#2dd4bf">2 · DECIDE</text>
  <rect x="60" y="544" width="260" height="64" rx="12" class="node"/>
  <text x="80" y="570" class="n">Call state</text>
  <text x="80" y="591" class="d">pace · history · right now</text>
  <rect x="350" y="544" width="260" height="64" rx="12" class="node"/>
  <text x="370" y="570" class="n">Questions</text>
  <text x="370" y="591" class="d">turn · listen · floor · quiet …</text>
  <rect x="640" y="544" width="260" height="64" rx="12" class="node"/>
  <text x="660" y="570" class="n">Task profile</text>
  <text x="660" y="591" class="d">persona · manner · policies</text>
  <path d="M190,608 V630 H420 V650" class="wire t" marker-end="url(#mt)"/>
  <path d="M480,608 V650" class="wire t" marker-end="url(#mt)"/>
  <path d="M770,608 V630 H540 V650" class="wire t" marker-end="url(#mt)"/>
  <ellipse cx="480" cy="706" rx="250" ry="78" fill="url(#halo)" class="halo"/>
  <rect x="320" y="654" width="320" height="104" rx="16" fill="url(#jevfill)" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="344" y="684" class="n" style="font-size:18px">Jev</text>
  <text x="344" y="704" class="d">a probability for every choice · tens of ms</text>
  <rect x="344" y="716" width="140" height="8" rx="4" class="bar"/><text x="492" y="724" class="small">yield 0.62</text>
  <rect x="344" y="730" width="56" height="8" rx="4" class="bar dim"/><text x="408" y="738" class="small">finish the sentence 0.25</text>
  <rect x="344" y="744" width="30" height="8" rx="4" class="bar dim"/><text x="382" y="752" class="small">carry on 0.13</text>
  <path d="M480,758 V790" class="wire t" marker-end="url(#mt)"/>
  <rect x="300" y="794" width="360" height="56" rx="12" class="node"/>
  <text x="320" y="818" class="n">Policy</text>
  <text x="320" y="838" class="d">sample · threshold · argmax, per decision</text>
  <path d="M480,850 V872" class="wire t" marker-end="url(#mt)"/>
  <rect x="300" y="876" width="360" height="56" rx="12" class="node"/>
  <text x="320" y="900" class="n">Action</text>
  <text x="320" y="920" class="d">answer · listening sound · yield · wait · hang up</text>
  <path d="M640,706 H780 V794" class="wire r" marker-end="url(#mr)"/>
  <rect x="690" y="798" width="210" height="134" rx="12" class="rec"/>
  <text x="710" y="824" class="n">Recorder</text>
  <text x="710" y="846" class="d">every decision and</text>
  <text x="710" y="864" class="d">the state Jev read</text>
  <text x="710" y="892" class="d">→ replay a call with a</text>
  <text x="710" y="910" class="d">reworded question</text>

  <!-- 3 SPEAK -->
  <rect x="36" y="980" width="888" height="200" rx="18" class="panel"/>
  <text x="60" y="1012" class="stage" fill="#fbbf24">3 · SPEAK</text>
  <path d="M400,932 V1010 H190 V1036" class="wire t" marker-end="url(#mt)"/>
  <text x="300" y="1002" class="small" text-anchor="middle">respond(kind)</text>
  <path d="M560,932 V1010 H770 V1036" class="wire a" marker-end="url(#ma)"/>
  <text x="668" y="1002" class="small" text-anchor="middle" style="fill:#fbbf24">hold · stop · finish the line</text>
  <rect x="60" y="1040" width="260" height="64" rx="12" class="node"/>
  <text x="80" y="1066" class="n">Responder</text>
  <text x="80" y="1087" class="d">any LLM · lines streamed</text>
  <path d="M320,1072 H342" class="wire a" marker-end="url(#ma)"/>
  <rect x="350" y="1040" width="260" height="64" rx="12" class="node"/>
  <text x="370" y="1066" class="n">Synthesizer</text>
  <text x="370" y="1087" class="d">any TTS and voice · first chunk plays</text>
  <path d="M610,1072 H632" class="wire a" marker-end="url(#ma)"/>
  <rect x="640" y="1040" width="260" height="64" rx="12" class="node"/>
  <text x="660" y="1066" class="n">Caller</text>
  <text x="660" y="1087" class="d">hears the line</text>
  <text x="480" y="1142" class="d" text-anchor="middle">Swap the language model to change latency or style; the decisions stay the same.</text>

  <!-- duplex loop -->
  <path d="M770,1104 V1206 H22 V204 H52" class="wire b" marker-end="url(#mb)"/>
  <text x="480" y="1226" class="lab" text-anchor="middle" style="fill:#60a5fa">Frames keep arriving while the agent talks: it hears you over itself. That is the full-duplex part.</text>

  <text x="48" y="1266" class="small">Grey nodes are swappable adapters. Reword a question, change a policy or a task profile, then replay real calls</text>
  <text x="48" y="1284" class="small">to see what changes.</text>
</svg>
