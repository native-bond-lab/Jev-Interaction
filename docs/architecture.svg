<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680" role="img" aria-label="JEV-Interaction in three stages. Hear: the caller's audio goes through voice activity detection and a streaming recognizer. Decide: the call state, the decision questions and the task profile go to Jev, which returns a probability for every choice; a policy turns them into an action. Speak: the action drives any language model and any speech synthesizer, and controls the caller's playback directly. Every decision is recorded for replay.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#141d30"/>
    </linearGradient>
    <linearGradient id="jevfill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f3d3a"/>
      <stop offset="1" stop-color="#0b2b33"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#60a5fa"/></marker>
    <marker id="mt" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2dd4bf"/></marker>
    <marker id="ma" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fbbf24"/></marker>
    <marker id="mr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/></marker>
    <path id="p-hear" d="M180,240 V272 M180,336 V368 M296,400 H368 V208"/>
    <path id="p-in" d="M180,240 V400 H340 V320 H448"/>
    <path id="p-out" d="M600,386 V452 H832 H868 V208 H1020 V400"/>
    <path id="p-ctl" d="M722,484 V604 H52 V208 H62"/>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #e5e7eb; }
    .title { font-size: 28px; font-weight: 750; letter-spacing: -0.01em; }
    .tag { font-size: 14px; fill: #94a3b8; }
    .stage { font-size: 12px; font-weight: 700; letter-spacing: 0.18em; }
    .sub { font-size: 12px; fill: #94a3b8; }
    .n { font-size: 15px; font-weight: 650; }
    .d { font-size: 12px; fill: #94a3b8; }
    .small { font-size: 11px; fill: #94a3b8; }
    .panel { fill: #ffffff; fill-opacity: 0.025; stroke: #1f2a40; stroke-width: 1.2; }
    .node { fill: #172036; stroke: #2b3a55; stroke-width: 1.2; }
    .wire { fill: none; stroke-width: 1.8; stroke-dasharray: 6 7; animation: flow 1.1s linear infinite; }
    .b { stroke: #60a5fa; } .t { stroke: #2dd4bf; } .a { stroke: #fbbf24; } .r { stroke: #fb7185; }
    .bar { fill: #2dd4bf; } .bar.dim { fill: #3b4a66; }
    .halo { animation: breathe 2.8s ease-in-out infinite; transform-origin: 600px 336px; }
    @keyframes flow { to { stroke-dashoffset: -26; } }
    @keyframes breathe { 0%, 100% { opacity: .35; transform: scale(.94); } 50% { opacity: 1; transform: scale(1.04); } }
    @media (prefers-reduced-motion: reduce) { .wire, .halo { animation: none; } .packets { display: none; } }
  </style>

  <rect width="1200" height="680" rx="22" fill="url(#bg)"/>
  <text x="48" y="66" class="title">JEV-Interaction</text>
  <text x="48" y="94" class="tag">Full-duplex voice where every turn-taking behaviour is a plain-language question, answered by Jev.</text>

  <!-- stage panels -->
  <rect x="40" y="120" width="280" height="440" rx="18" class="panel"/>
  <rect x="344" y="120" width="512" height="440" rx="18" class="panel"/>
  <rect x="880" y="120" width="280" height="440" rx="18" class="panel"/>
  <text x="64" y="152" class="stage" fill="#60a5fa">1 · HEAR</text>
  <text x="368" y="152" class="stage" fill="#2dd4bf">2 · DECIDE</text>
  <text x="904" y="152" class="stage" fill="#fbbf24">3 · SPEAK</text>

  <!-- HEAR -->
  <rect x="64" y="176" width="232" height="64" rx="12" class="node"/>
  <rect x="64" y="186" width="4" height="44" rx="2" fill="#60a5fa"/>
  <text x="84" y="203" class="n">Caller</text>
  <text x="84" y="223" class="d">microphone, 200 ms frames</text>
  <rect x="64" y="272" width="232" height="64" rx="12" class="node"/>
  <rect x="64" y="282" width="4" height="44" rx="2" fill="#60a5fa"/>
  <text x="84" y="299" class="n">Voice activity</text>
  <text x="84" y="319" class="d">any VAD · energy built in</text>
  <rect x="64" y="368" width="232" height="64" rx="12" class="node"/>
  <rect x="64" y="378" width="4" height="44" rx="2" fill="#60a5fa"/>
  <text x="84" y="395" class="n">Streaming recognizer</text>
  <text x="84" y="415" class="d">closed segments + timing</text>
  <path d="M180,240 V270" class="wire b" marker-end="url(#mb)"/>
  <path d="M180,336 V366" class="wire b" marker-end="url(#mb)"/>
  <text x="64" y="470" class="small">words, pauses, who is talking,</text>
  <text x="64" y="486" class="small">whether the agent is speaking</text>

  <!-- DECIDE -->
  <rect x="368" y="176" width="150" height="64" rx="12" class="node"/>
  <text x="443" y="203" class="n" text-anchor="middle">Call state</text>
  <text x="443" y="223" class="d" text-anchor="middle">pace · history · now</text>
  <rect x="531" y="176" width="150" height="64" rx="12" class="node"/>
  <text x="606" y="203" class="n" text-anchor="middle">Questions</text>
  <text x="606" y="223" class="d" text-anchor="middle">turn · listen · floor …</text>
  <rect x="694" y="176" width="138" height="64" rx="12" class="node"/>
  <text x="763" y="203" class="n" text-anchor="middle">Task profile</text>
  <text x="763" y="223" class="d" text-anchor="middle">manner · policies</text>
  <path d="M296,400 H340 V208 H366" class="wire b" marker-end="url(#mb)"/>

  <ellipse cx="600" cy="336" rx="220" ry="90" fill="url(#halo)" class="halo"/>
  <rect x="448" y="286" width="304" height="100" rx="16" fill="url(#jevfill)" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="470" y="322" style="font-size: 24px; font-weight: 750; fill: #5eead4">Jev</text>
  <text x="470" y="344" class="d">a probability for</text>
  <text x="470" y="360" class="d">every choice · tens of ms</text>
  <text x="606" y="313" class="small">yield</text>
  <rect x="650" y="305" width="80" height="8" rx="4" class="bar dim"/>
  <rect x="650" y="305" width="66" height="8" rx="4" class="bar"><animate attributeName="width" values="66;20;56;66" dur="7s" repeatCount="indefinite"/></rect>
  <text x="606" y="333" class="small">finish</text>
  <rect x="650" y="325" width="80" height="8" rx="4" class="bar dim"/>
  <rect x="650" y="325" width="10" height="8" rx="4" class="bar" style="fill:#5b8f9a"><animate attributeName="width" values="10;48;16;10" dur="7s" repeatCount="indefinite"/></rect>
  <text x="606" y="353" class="small">carry on</text>
  <rect x="650" y="345" width="80" height="8" rx="4" class="bar dim"/>
  <rect x="650" y="345" width="6" height="8" rx="4" class="bar" style="fill:#5b8f9a"><animate attributeName="width" values="6;14;12;6" dur="7s" repeatCount="indefinite"/></rect>

  <path d="M443,240 L505,284" class="wire t" marker-end="url(#mt)"/>
  <path d="M606,240 V284" class="wire t" marker-end="url(#mt)"/>
  <path d="M763,240 L700,284" class="wire t" marker-end="url(#mt)"/>

  <rect x="368" y="420" width="220" height="64" rx="12" class="node"/>
  <text x="478" y="447" class="n" text-anchor="middle">Policy</text>
  <text x="478" y="467" class="d" text-anchor="middle">sample · threshold · argmax</text>
  <rect x="612" y="420" width="220" height="64" rx="12" class="node"/>
  <text x="722" y="447" class="n" text-anchor="middle">Action</text>
  <text x="722" y="467" class="d" text-anchor="middle">answer · listen · yield · hang up</text>
  <path d="M520,386 L490,418" class="wire t" marker-end="url(#mt)"/>
  <path d="M588,452 H610" class="wire t" marker-end="url(#mt)"/>

  <rect x="368" y="508" width="330" height="34" rx="10" fill="none" stroke="#2b3a55" stroke-dasharray="4 4"/>
  <text x="533" y="530" class="small" text-anchor="middle">Recorder · every decision + the state Jev read → replay</text>

  <!-- SPEAK -->
  <rect x="904" y="176" width="232" height="64" rx="12" class="node"/>
  <rect x="904" y="186" width="4" height="44" rx="2" fill="#fbbf24"/>
  <text x="924" y="203" class="n">Responder</text>
  <text x="924" y="223" class="d">any LLM · lines streamed</text>
  <rect x="904" y="272" width="232" height="64" rx="12" class="node"/>
  <rect x="904" y="282" width="4" height="44" rx="2" fill="#fbbf24"/>
  <text x="924" y="299" class="n">Synthesizer</text>
  <text x="924" y="319" class="d">any TTS · first chunk plays</text>
  <rect x="904" y="368" width="232" height="64" rx="12" class="node"/>
  <rect x="904" y="378" width="4" height="44" rx="2" fill="#fbbf24"/>
  <text x="924" y="395" class="n">Caller</text>
  <text x="924" y="415" class="d">hears the line</text>
  <path d="M832,452 H868 V208 H902" class="wire a" marker-end="url(#ma)"/>
  <text x="872" y="168" class="small" text-anchor="end">respond(kind)</text>
  <path d="M1020,240 V270" class="wire a" marker-end="url(#ma)"/>
  <path d="M1020,336 V366" class="wire a" marker-end="url(#ma)"/>
  <text x="904" y="470" class="small">swap the model to change latency;</text>
  <text x="904" y="486" class="small">the decisions stay the same</text>

  <!-- control -->
  <path d="M722,484 V604 H52 V208 H62" class="wire r" marker-end="url(#mr)"/>
  <text x="400" y="596" class="small" style="fill:#fda4af" text-anchor="middle">hold · unhold · stop · finish the line  —  straight to the caller's playback</text>

  <!-- packets -->
  <g class="packets">
    <circle r="4.5" fill="#60a5fa"><animateMotion dur="2.6s" repeatCount="indefinite" path="M180,240 V400 H340 V320 H448"/></circle>
    <circle r="4.5" fill="#2dd4bf"><animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M600,386 L520,386 L490,420 L588,452 H612"/></circle>
    <circle r="4.5" fill="#fbbf24"><animateMotion dur="3s" begin="1.4s" repeatCount="indefinite" path="M832,452 H868 V208 H1020 V400"/></circle>
    <circle r="4" fill="#fb7185"><animateMotion dur="4s" begin="2s" repeatCount="indefinite" path="M722,484 V604 H52 V208"/></circle>
  </g>

  <text x="48" y="646" class="small">Grey nodes are swappable adapters. Reword a question, change a policy or a task profile, then replay real calls to see what changes.</text>
</svg>
