<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="1000" height="620" role="img" aria-label="jev-interaction architecture: caller audio goes through VAD and a streaming recognizer into the interaction layer, where the call state and the decision questions are judged by Jev and a policy turns probabilities into actions; actions drive the responder and synthesizer, and control the caller's playback directly; every decision is recorded for replay.">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#78716c"/>
    </marker>
    <marker id="t" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#0f766e"/>
    </marker>
    <filter id="s" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1c1917" flood-opacity="0.08"/>
    </filter>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; fill: #1c1917; }
    .h { font-size: 15px; font-weight: 650; }
    .b { font-size: 12.5px; fill: #57534e; }
    .l { font-size: 11.5px; fill: #78716c; }
    .lt { font-size: 11.5px; fill: #0f766e; font-weight: 600; }
    .title { font-size: 20px; font-weight: 700; }
    .box { fill: #ffffff; stroke: #d6d3d1; stroke-width: 1.2; }
    .core { fill: #f0fdfa; stroke: #5eead4; stroke-width: 1.5; }
    .jev { fill: #ccfbf1; stroke: #0f766e; stroke-width: 1.6; }
    .line { stroke: #78716c; stroke-width: 1.5; fill: none; stroke-dasharray: 5 6; animation: flow 1.2s linear infinite; }
    .ctl { stroke: #0f766e; stroke-width: 1.6; fill: none; stroke-dasharray: 6 4; animation: flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -22; } }
    .dot { fill: #0f766e; } .dot.w { fill: #c2410c; }
    .jevpulse { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { stroke-opacity: .9; stroke-width: 1.6; } 50% { stroke-opacity: .35; stroke-width: 6; } }
    @media (prefers-reduced-motion: reduce) { .line, .ctl, .jevpulse { animation: none; } .dots { display: none; } }
    .rec { stroke: #a8a29e; stroke-width: 1.3; fill: none; stroke-dasharray: 3 4; }
  </style>

  <rect x="0.5" y="0.5" width="999" height="619" rx="18" fill="#fafaf9" stroke="#e7e5e4"/>
  <text x="30" y="44" class="title">jev-interaction</text>
  <text x="200" y="44" class="b">turn-taking as plain-language decisions, judged by Jev</text>

  <!-- caller -->
  <rect x="30" y="70" width="130" height="500" rx="14" class="box" filter="url(#s)"/>
  <text x="95" y="100" class="h" text-anchor="middle">Caller</text>
  <text x="95" y="118" class="l" text-anchor="middle">browser · phone</text>
  <text x="95" y="155" class="b" text-anchor="middle">mic</text>
  <text x="95" y="330" class="b" text-anchor="middle">playback</text>
  <text x="95" y="525" class="b" text-anchor="middle">pause · resume · stop</text>
  <text x="95" y="560" class="b" text-anchor="middle">speaker</text>

  <!-- input row -->
  <rect x="230" y="95" width="140" height="60" rx="10" class="box" filter="url(#s)"/>
  <text x="300" y="121" class="h" text-anchor="middle">VAD</text>
  <text x="300" y="140" class="l" text-anchor="middle">voice / no voice</text>
  <rect x="400" y="95" width="190" height="60" rx="10" class="box" filter="url(#s)"/>
  <text x="495" y="121" class="h" text-anchor="middle">Recognizer</text>
  <text x="495" y="140" class="l" text-anchor="middle">streaming ASR · segments</text>
  <path d="M160,150 H230" class="line" marker-end="url(#a)"/>
  <text x="195" y="143" class="l" text-anchor="middle">200 ms</text>
  <path d="M370,125 H400" class="line" marker-end="url(#a)"/>
  <path d="M495,155 V176 H330 V240" class="line" marker-end="url(#a)"/>
  <text x="420" y="171" class="l">words + timing</text>

  <!-- interaction layer -->
  <rect x="230" y="190" width="560" height="270" rx="16" class="core"/>
  <text x="372" y="217" class="h">Interaction layer</text>
  <text x="508" y="217" class="lt">every behaviour is a question</text>

  <rect x="250" y="240" width="160" height="70" rx="10" class="box"/>
  <text x="330" y="266" class="h" text-anchor="middle">Call state</text>
  <text x="330" y="284" class="l" text-anchor="middle">pace · history</text>
  <text x="330" y="299" class="l" text-anchor="middle">what is on the line now</text>

  <rect x="430" y="240" width="160" height="70" rx="10" class="box"/>
  <text x="510" y="266" class="h" text-anchor="middle">Questions</text>
  <text x="510" y="284" class="l" text-anchor="middle">turn · listen · floor</text>
  <text x="510" y="299" class="l" text-anchor="middle">cut in · quiet</text>

  <rect x="610" y="240" width="160" height="70" rx="10" class="box"/>
  <text x="690" y="266" class="h" text-anchor="middle">Task profile</text>
  <text x="690" y="284" class="l" text-anchor="middle">companion · support</text>
  <text x="690" y="299" class="l" text-anchor="middle">tutor · interviewer …</text>

  <rect x="250" y="360" width="160" height="80" rx="10" fill="none" stroke="#2dd4bf" class="jevpulse"/>
  <rect x="250" y="360" width="160" height="80" rx="10" class="jev" filter="url(#s)"/>
  <text x="330" y="391" class="h" text-anchor="middle" fill="#0f766e">Jev</text>
  <text x="330" y="410" class="l" text-anchor="middle">a probability per choice</text>
  <text x="330" y="426" class="l" text-anchor="middle">tens of ms</text>

  <rect x="430" y="360" width="160" height="80" rx="10" class="box"/>
  <text x="510" y="391" class="h" text-anchor="middle">Policy</text>
  <text x="510" y="410" class="l" text-anchor="middle">sample · threshold · argmax</text>
  <text x="510" y="426" class="l" text-anchor="middle">per decision, per task</text>

  <rect x="610" y="360" width="160" height="80" rx="10" class="box"/>
  <text x="690" y="391" class="h" text-anchor="middle">Action</text>
  <text x="690" y="410" class="l" text-anchor="middle">answer · listen · yield</text>
  <text x="690" y="426" class="l" text-anchor="middle">hold · go on · hang up</text>

  <path d="M330,310 V360" class="line" marker-end="url(#a)"/>
  <path d="M480,310 L380,360" class="line" marker-end="url(#a)"/>
  <path d="M640,310 C640,330 360,320 345,358" class="line" marker-end="url(#a)"/>
  <text x="600" y="336" class="l">manner</text>
  <path d="M700,310 L560,360" class="line" marker-end="url(#a)"/>
  <text x="652" y="350" class="l">policies</text>
  <path d="M410,400 H430" class="line" marker-end="url(#a)"/>
  <path d="M590,400 H610" class="line" marker-end="url(#a)"/>

  <!-- output column -->
  <rect x="820" y="240" width="150" height="70" rx="10" class="box" filter="url(#s)"/>
  <text x="895" y="266" class="h" text-anchor="middle">Responder</text>
  <text x="895" y="284" class="l" text-anchor="middle">any LLM</text>
  <text x="895" y="299" class="l" text-anchor="middle">lines, streamed</text>
  <rect x="820" y="360" width="150" height="70" rx="10" class="box" filter="url(#s)"/>
  <text x="895" y="386" class="h" text-anchor="middle">Synthesizer</text>
  <text x="895" y="404" class="l" text-anchor="middle">any TTS</text>
  <text x="895" y="419" class="l" text-anchor="middle">first chunk plays</text>
  <path d="M770,385 H800 V275 H820" class="line" marker-end="url(#a)"/>
  <text x="803" y="232" class="l">respond(kind)</text>
  <path d="M895,310 V360" class="line" marker-end="url(#a)"/>
  <path d="M895,430 V555 H160" class="line" marker-end="url(#a)"/>
  <text x="560" y="548" class="l" text-anchor="middle">line audio</text>

  <!-- control and state -->
  <path d="M690,440 V515 H160" class="ctl" marker-end="url(#t)"/>
  <text x="420" y="508" class="lt" text-anchor="middle">hold · unhold · stop · finish the line</text>
  <path d="M160,330 H230" class="line" marker-end="url(#a)"/>
  <text x="195" y="322" class="l" text-anchor="middle">idle</text>

  <!-- recorder -->
  <rect x="820" y="460" width="150" height="62" rx="10" class="box"/>
  <text x="895" y="484" class="h" text-anchor="middle">Recorder</text>
  <text x="895" y="502" class="l" text-anchor="middle">every decision → replay</text>
  <path d="M790,450 H805 V490 H820" class="rec" marker-end="url(#a)"/>

  <path id="p-mic" d="M160,150 H230" fill="none"/>
  <path id="p-asr" d="M300,125 H495 V176 H330 V240" fill="none"/>
  <path id="p-decide" d="M330,310 V400 H690" fill="none"/>
  <path id="p-out" d="M690,400 H800 V275 H895 V555 H160" fill="none"/>
  <path id="p-ctl" d="M690,440 V515 H160" fill="none"/>
  <g class="dots">
    <circle r="4.5" class="dot"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p-mic"/></animateMotion></circle>
    <circle r="4.5" class="dot"><animateMotion dur="2.2s" begin="0.4s" repeatCount="indefinite"><mpath href="#p-asr"/></animateMotion></circle>
    <circle r="4.5" class="dot"><animateMotion dur="1.8s" begin="0.9s" repeatCount="indefinite"><mpath href="#p-decide"/></animateMotion></circle>
    <circle r="4.5" class="dot w"><animateMotion dur="3.6s" begin="1.2s" repeatCount="indefinite"><mpath href="#p-out"/></animateMotion></circle>
    <circle r="4" class="dot"><animateMotion dur="2.6s" begin="2s" repeatCount="indefinite"><mpath href="#p-ctl"/></animateMotion></circle>
  </g>

  <text x="30" y="600" class="l">Grey boxes are swappable adapters. Change a question's words, a policy or a task profile, then replay recorded calls to see what changes.</text>
</svg>
