name: release

# A tag v* builds the wheel and sdist, checks the installed wheel, and publishes to PyPI by trusted publishing (no
# token in the repository). One-time setup on PyPI: add a trusted publisher for project jev-interaction, owner
# native-bond-lab, repository Jev-Interaction, workflow release.yml, environment pypi.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - name: the tag is the package version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME is not v$version"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc++1
      - name: the wheel, installed alone, has every file it reads
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[server]"
          count=$(ls jev_interaction/profiles/*.yaml | wc -l)
          cp scripts/check_wheel.py "$RUNNER_TEMP/" && cd "$RUNNER_TEMP"
          ./venv/bin/python check_wheel.py "${GITHUB_REF_NAME#v}" "$count"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
