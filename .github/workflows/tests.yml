name: tests

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc++1   # TEN VAD's native library
      - run: pip install -e ".[server,dev]" pytest-timeout
      - name: pytest
        run: |
          set -o pipefail
          status=0
          pytest -q --timeout=120 -rf 2>&1 | tee pytest.log || status=$?
          tail -40 pytest.log >> "$GITHUB_STEP_SUMMARY"
          names=$(grep -E '^(FAILED|ERROR) ' pytest.log | tr '\n' '|' | cut -c1-900)
          [ -n "$names" ] && echo "::error title=pytest failures::${names}"
          exit $status
      - run: python examples/minimal.py
      - name: the installed command serves the page
        run: |
          cd "$RUNNER_TEMP" && jev-interaction serve --port 8099 --quiet &
          for i in $(seq 1 20); do curl -sf localhost:8099/api/health && break; sleep 1; done
          curl -sf localhost:8099/api/profiles | grep -q lyra
          curl -sf localhost:8099/ | grep -qi "<html"

  package:                  # build the wheel and sdist, install the wheel in a clean venv, check it from outside the repo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine && python -m build && twine check --strict dist/*
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libc++1
      - name: the wheel, installed alone, has every file it reads
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install "$(ls dist/*.whl)[server]"
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          count=$(ls jev_interaction/profiles/*.yaml | wc -l)
          cp scripts/check_wheel.py "$RUNNER_TEMP/" && cd "$RUNNER_TEMP"
          ./venv/bin/python check_wheel.py "$version" "$count"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6"
      - run: ruff check .
