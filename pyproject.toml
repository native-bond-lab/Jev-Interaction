[project]
name = "jev-interaction"
version = "0.1.0"
description = "A full-duplex voice framework whose turn-taking is a set of plain-language decisions judged by Jev, not a trained model."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "httpx>=0.27", "websockets>=12", "pyyaml>=6"]

[project.optional-dependencies]
server = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
