<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jev pet</title>
<style>
  :root { --ink: #2b1b12; --paper: #fff8ec; }
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; -webkit-user-select: none; }
  body { display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
         font: 13px/1.35 ui-monospace, "SF Mono", Menlo, "PingFang SC", monospace; color: var(--ink); -webkit-app-region: drag; }
  body.page { background: #1d1f27; }                 /* opened in a browser tab, not in the floating window */
  #bubble { max-width: 210px; margin: 0 8px 6px; padding: 7px 9px; background: var(--paper); border: 2px solid var(--ink);
            box-shadow: 3px 3px 0 var(--ink); white-space: pre-wrap; word-break: break-word; opacity: 0; transition: opacity .25s;
            max-height: 96px; overflow: hidden; }
  #bubble.on { opacity: 1; }
  #pet { width: 192px; height: 256px; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; -webkit-app-region: no-drag; }
  #pet:focus-visible { outline: 2px dashed var(--paper); outline-offset: 2px; }
</style>
</head>
<body>
<div id="bubble" role="status" aria-live="polite"></div>
<canvas id="pet" width="48" height="64" tabindex="0" role="button" aria-label="Jev pet"></canvas>
<script src="pet.js"></script>
</body>
</html>
